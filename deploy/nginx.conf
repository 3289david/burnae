# /etc/nginx/sites-available/burnae.kr
server {
    listen 80;
    server_name burnae.kr www.burnae.kr;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pterodactyl 쪽이 느릴 때(서버 생성/전원 동작 등) nginx 기본 60초 타임아웃에 먼저
        # 걸려서 nginx 자체 504 HTML 에러 페이지가 내려가 버리는 걸 막는다 — 프론트엔드가
        # 그 HTML을 res.json()으로 파싱하려다 "Unexpected token '<'"로 깨지는 원인이었음
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 120s;
    }
}

# HTTPS는 certbot이 자동으로 위 블록을 확장해줍니다:
#   sudo certbot --nginx -d burnae.kr -d www.burnae.kr
